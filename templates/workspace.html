{% extends 'base.html' %}{% block content %}<section class="page"><div class="section-row"><div><span class="badge">MY WORKSPACE</span><h1>Your documents</h1></div></div><form class="search"><input name="q" value="{{q}}" placeholder="Search documents..."><button>Search</button></form><div class="documents cards">{% for doc in docs %}<article class="document-card"><span class="tool-tag">{{doc.tool.replace('_',' ')}}</span><h3>{{doc.title}}</h3><p>Updated {{doc.updated_at.strftime('%d %b %Y %H:%M')}}</p><div><a class="text-btn" href="{{url_for('editor',doc_id=doc.id)}}">Edit</a><a class="text-btn" href="{{url_for('duplicate_document',doc_id=doc.id)}}">Duplicate</a><form method="post" action="{{url_for('delete_document',doc_id=doc.id)}}" class="inline"><button class="danger" onclick="return confirm('Delete this document?')">Delete</button></form></div></article>{% else %}<div class="empty">Your workspace is empty.</div>{% endfor %}</div></section>{% endblock %}
