{% extends 'base.html' %}{% block content %}<section class="page editor-page"><div class="editor-head"><div><span class="badge">{{doc.tool.replace('_',' ').upper()}}</span><h1>Advanced Editor</h1></div><div class="export-actions"><a href="{{url_for('export_document',doc_id=doc.id,fmt='pdf')}}">PDF</a><a href="{{url_for('export_document',doc_id=doc.id,fmt='docx')}}">Word</a>{% if doc.tool=='ppt_generator' %}<a href="{{url_for('export_document',doc_id=doc.id,fmt='pptx')}}">PPTX</a>{% endif %}</div></div><form method="post" id="editorForm"><input class="title-input" name="title" value="{{doc.title}}"><div class="toolbar"><button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="italic"><i>I</i></button><button type="button" id="insertHeading">H</button><span>Auto-save ready</span></div><textarea id="contentEditor" name="content">{{doc.content}}</textarea><div class="editor-footer"><span id="saveStatus">Ready to save</span><button class="btn">💾 Save Changes</button></div></form></section>{% endblock %}
